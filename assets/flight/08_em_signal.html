<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Segnale EM nel tempo (primi ms)</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0a0a0a;
        height: 100%;
      }
      .chart-wrap {
        box-sizing: border-box;
        height: 460px;
        padding: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      img {
        display: block;
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
        background: #fff;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="chart-wrap">
      <img
        src="em-signal-first-ms.png"
        width="900"
        height="420"
        alt="Segnale EM nel tempo (primi ms) — ampiezza in volt"
      />
    </div>
  </body>
</html>
